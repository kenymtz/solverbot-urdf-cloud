  - {name: tennis_ball,  category: toys,     shape: sphere,   size: [0.067, 0.067, 0.067], mass: 0.06, rgb: [0.85, 0.95, 0.20], place_on: bed, xy_off: [-0.2, 0.1]}

# Ubicaciones de inicio de los desafíos (imagen 12): fuera de la arena, frente a la puerta de entrada.
start_locations:
  outside_entrance: {xy: [-0.60, 2.59], yaw: 0.0}
  # Demo de Pick and Place: robot en la cocina con la mesa del comedor a su IZQUIERDA (el Piper va montado
  # en el costado izquierdo de la base, eje del brazo hacia +Y del robot).
  pick_place_demo: {xy: [5.10, 1.30], yaw: 0.0}
