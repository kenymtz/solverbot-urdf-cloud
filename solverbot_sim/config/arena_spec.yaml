  - {name: soft_scrub,   category: cleaning, shape: cylinder, size: [0.07, 0.07, 0.20], mass: 0.30, rgb: [0.95, 0.95, 0.95], place_on: cooking_table, xy_off: [0.10, 0.05]}
  - {name: orange,       category: fruits,   shape: sphere,   size: [0.075, 0.075, 0.075], mass: 0.15, rgb: [1.0, 0.55, 0.05], place_on: dinner_table, xy_off: [0.0, 0.0]}
  - {name: apple,        category: fruits,   shape: sphere,   size: [0.07, 0.07, 0.07], mass: 0.15, rgb: [0.80, 0.05, 0.05], place_on: dinner_table, xy_off: [0.20, 0.10]}
  - {name: cola_can,     category: drinks,   shape: cylinder, size: [0.066, 0.066, 0.12], mass: 0.35, rgb: [0.85, 0.05, 0.05], place_on: cabinet, xy_off: [0.0, -0.2]}
  - {name: milk_bottle,  category: drinks,   shape: cylinder, size: [0.08, 0.08, 0.16], mass: 0.40, rgb: [0.95, 0.95, 0.98], place_on: cabinet, xy_off: [0.0, 0.2]}
  - {name: jello_box,    category: snacks,   shape: box,      size: [0.09, 0.03, 0.07], mass: 0.10, rgb: [0.85, 0.10, 0.15], place_on: shelf, xy_off: [-0.3, 0.0]}
  - {name: pringles,     category: snacks,   shape: cylinder, size: [0.075, 0.075, 0.23], mass: 0.20, rgb: [0.75, 0.10, 0.10], place_on: shelf, xy_off: [0.2, 0.0]}
  - {name: spam_can,     category: foods,    shape: box,      size: [0.10, 0.06, 0.08], mass: 0.34, rgb: [0.20, 0.30, 0.70], place_on: coffee_table, xy_off: [0.0, 0.0]}
  - {name: tshirt,       category: fabrics,  shape: box,      size: [0.30, 0.25, 0.03], mass: 0.15, rgb: [0.20, 0.45, 0.80], place_on: laundry_table, xy_off: [0.0, 0.0]}
