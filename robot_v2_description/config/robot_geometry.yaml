provenance:
  scan_scale: 'escaneo no métrico; (trocha 0.562 + ancho 0.055 del repo) / dist. exterior-exterior
    neumáticos (0.4308 u.). Contrastado: cuerpo Hokuyo 50 mm (CAD) ≈ 1.43, rueda 6.5in
    ≈ 1.41, pantalla 15.6in 16:9'
  base_link: 'centro del marco superior del chasis (escaneo) proyectado al piso local
    bajo las ruedas (convención del repo: base_footprint = base_link)'
  wheels: 'centro = círculo LSQ al arco superior del neumático; Y = cara exterior
    del flanco - ancho/2; colisión: radio = altura medida del eje'
  rear_casters: centro del aro naranja (captura parcial, ±1-2 cm); pivote pasivo no
    modelado
  upper_box_link: posición del modelo anterior (robot_scan_ws) re-escalada; verificada
    contra el nuevo escaneo (borde inferior de la pantalla)
  arm_link: punto de unión del brazo con el costado izquierdo de la caja (y = 0.185
    m), aproximado
  camera_link: centro de la carcasa de la cámara; orientación = normal media de la
    cara frontal (pitch medido)
  laser_mount: centro del cuerpo del Hokuyo medido en el escaneo, base sobre la placa
    negra; laser = +0.0474 m (urg_node)
  collision: cajas = percentiles 1-99 % de los vértices de la malla visual de cada
    link
