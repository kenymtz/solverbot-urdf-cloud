# =====================================================================================
#  GEOMETRÍA SOLO VISUAL de robot_v3 (no afecta colisiones, inercias, joints ni frames).
#  Primitivas que reproducen la estructura del robot real, medida sobre el escaneo métrico de
#  robot_v2_description (escala corregida 1.4322; ver su README). Herramienta de medición:
#  tools/measure_v2_scan.py. Precisión esperable: ±1-2 cm (ruido del escaneo) y ±3 % de escala.
#
#  Formato de cada pieza:
#    box:      min/max = esquinas en coordenadas "world" (base_link con el elevador y el cabezal en cero)
#              o "local" (marco del link), según el campo frame del grupo.
#    box_c:    center + size (+ rpy opcional), en el marco indicado.
#    cyl:      center + radius + length + rpy (eje del cilindro = z rotado por rpy).
#  Las piezas se convierten en un DAE por link (tools/make_structure_visuals.py -> meshes/structure/).
# =====================================================================================

# Colores planos RGB (0-1). Grises de aluminio y negros cercanos a la mediana de las texturas del escaneo v2
# (perfiles/columna ~0.39 con luz de interior; ruedas 0.12; ruedas locas anaranjadas).
materials:
  profile:         [0.66, 0.67, 0.70]
  plate:           [0.10, 0.10, 0.11]
  electronics:     [0.20, 0.21, 0.23]
  tire:            [0.07, 0.07, 0.07]
  hub:             [0.48, 0.49, 0.51]
  caster:          [0.93, 0.50, 0.12]
  lidar_body:      [0.13, 0.13, 0.13]
  lidar_window:    [0.02, 0.02, 0.03]
  rail:            [0.52, 0.53, 0.56]
  screw:           [0.78, 0.76, 0.68]
  carriage:        [0.28, 0.30, 0.33]
  tray:            [0.14, 0.14, 0.15]
  housing:         [0.36, 0.38, 0.42]
  bezel:           [0.05, 0.05, 0.06]
  screen:          [0.05, 0.30, 0.55]
  servo:           [0.08, 0.08, 0.08]
  mic:             [0.03, 0.03, 0.03]
  realsense:       [0.62, 0.63, 0.66]
  realsense_front: [0.02, 0.02, 0.02]
  lens:            [0.25, 0.27, 0.34]

chassis:            # link base_link (world = base_link)
  frame: world
  parts:
    # --- Nivel inferior de perfiles 20x20 (z 0.165-0.185 en el escaneo), esquinas achaflanadas
    - {box: {min: [-0.238, -0.235, 0.165], max: [0.197, -0.215, 0.185]}, material: profile}
    - {box: {min: [-0.238, 0.220, 0.165], max: [0.197, 0.240, 0.185]}, material: profile}
    - {box: {min: [-0.258, -0.215, 0.165], max: [-0.238, 0.220, 0.185]}, material: profile}
    - {box: {min: [0.197, -0.215, 0.165], max: [0.217, 0.220, 0.185]}, material: profile}
    # --- Nivel superior (z 0.29-0.315)
    - {box: {min: [-0.238, -0.235, 0.293], max: [0.197, -0.215, 0.313]}, material: profile}
    - {box: {min: [-0.238, 0.220, 0.293], max: [0.197, 0.240, 0.313]}, material: profile}
    - {box: {min: [-0.258, -0.215, 0.293], max: [-0.238, 0.220, 0.313]}, material: profile}
    - {box: {min: [0.197, -0.215, 0.293], max: [0.217, 0.220, 0.313]}, material: profile}
    # --- Chaflanes de esquina (planta del escaneo: esquinas cortadas ~2 cm)
    - {box_c: {center: [-0.243, -0.220, 0.175], size: [0.03, 0.02, 0.02], rpy: [0, 0, 0.785]}, material: profile}
    - {box_c: {center: [-0.243, 0.225, 0.175], size: [0.03, 0.02, 0.02], rpy: [0, 0, -0.785]}, material: profile}
    - {box_c: {center: [0.202, -0.220, 0.175], size: [0.03, 0.02, 0.02], rpy: [0, 0, -0.785]}, material: profile}
    - {box_c: {center: [0.202, 0.225, 0.175], size: [0.03, 0.02, 0.02], rpy: [0, 0, 0.785]}, material: profile}
    - {box_c: {center: [-0.243, -0.220, 0.303], size: [0.03, 0.02, 0.02], rpy: [0, 0, 0.785]}, material: profile}
    - {box_c: {center: [-0.243, 0.225, 0.303], size: [0.03, 0.02, 0.02], rpy: [0, 0, -0.785]}, material: profile}
    - {box_c: {center: [0.202, -0.220, 0.303], size: [0.03, 0.02, 0.02], rpy: [0, 0, -0.785]}, material: profile}
    - {box_c: {center: [0.202, 0.225, 0.303], size: [0.03, 0.02, 0.02], rpy: [0, 0, 0.785]}, material: profile}
    # --- Montantes verticales (columnas densas del escaneo en x -0.26 / +0.21, y ±0.13), del piso del chasis al nivel superior
    - {box: {min: [-0.258, -0.145, 0.115], max: [-0.238, -0.125, 0.313]}, material: profile}
    - {box: {min: [-0.258, 0.125, 0.115], max: [-0.238, 0.145, 0.313]}, material: profile}
    - {box: {min: [0.197, -0.145, 0.115], max: [0.217, -0.125, 0.313]}, material: profile}
    - {box: {min: [0.197, 0.125, 0.115], max: [0.217, 0.145, 0.313]}, material: profile}
    # --- Placa inferior (línea horizontal en z ~0.145 en frente y lateral)
    - {box: {min: [-0.238, -0.215, 0.140], max: [0.197, 0.220, 0.148]}, material: plate}
    # --- Traviesas del nivel superior bajo la columna (la columna arranca en z 0.33-0.34 sobre el chasis)
    - {box: {min: [-0.105, -0.215, 0.293], max: [-0.085, 0.220, 0.313]}, material: profile}
    - {box: {min: [0.005, -0.215, 0.293], max: [0.025, 0.220, 0.313]}, material: profile}
    # --- Volumen ocupado entre niveles (hoverboard, baterías y electrónica: bulto del escaneo, aproximado)
    - {box: {min: [-0.200, -0.170, 0.150], max: [0.180, 0.180, 0.262]}, material: electronics}
    # --- Placa negra del Hokuyo (escaneo: x 0.20-0.27 a z 0.31-0.33; base del Hokuyo a z 0.3165)
    - {box: {min: [0.197, -0.040, 0.3115], max: [0.270, 0.055, 0.3165]}, material: plate}

wheel:              # left_wheel / right_wheel (local: eje del motor; giro sobre +Y)
  frame: local
  parts:
    # neumático: radio y ancho = los de la colisión/visual calibrados (no cambian)
    - {cyl: {center: [0, 0, 0], radius: 0.084, length: 0.055, rpy: [1.5708, 0, 0]}, material: tire}
    # llanta del motor-rueda (6.5"), sobresale 1 mm a cada lado
    - {cyl: {center: [0, 0, 0], radius: 0.052, length: 0.057, rpy: [1.5708, 0, 0]}, material: hub}
    # radio marcador para que se vea el giro
    - {box_c: {center: [0, 0, 0], size: [0.090, 0.0575, 0.012]}, material: profile}

caster:             # rear_*_caster (local: centro de la rueda loca, 4 cm sobre el piso)
  frame: local
  parts:
    - {cyl: {center: [0, 0, 0], radius: 0.0402, length: 0.028, rpy: [1.5708, 0, 0]}, material: caster}
    - {box_c: {center: [0, 0.0185, 0.028], size: [0.030, 0.004, 0.056]}, material: profile}
    - {box_c: {center: [0, -0.0185, 0.028], size: [0.030, 0.004, 0.056]}, material: profile}
    - {box_c: {center: [0, 0, 0.059], size: [0.050, 0.050, 0.006]}, material: profile}
    - {cyl: {center: [0, 0, 0.068], radius: 0.008, length: 0.014, rpy: [0, 0, 0]}, material: profile}

hokuyo:             # laser_mount (local: base del cuerpo). UST-05LX: 50 x 50 x 70 mm (hoja de datos)
  frame: local
  parts:
    - {box_c: {center: [0, 0, 0.020], size: [0.050, 0.050, 0.040]}, material: lidar_body}
    - {cyl: {center: [0, 0, 0.0475], radius: 0.0215, length: 0.015, rpy: [0, 0, 0]}, material: lidar_window}
    - {cyl: {center: [0, 0, 0.0625], radius: 0.0215, length: 0.015, rpy: [0, 0, 0]}, material: lidar_body}

column:             # torso_column (world). Módulo lineal: envolvente del escaneo x[-0.096, 0.021], y[-0.107, 0.110]
  frame: world
  parts:
    # placa de montaje sobre las traviesas del chasis
    - {box: {min: [-0.115, -0.125, 0.313], max: [0.035, 0.125, 0.342]}, material: plate}
    # paredes laterales (líneas en y = ±0.105 del corte en planta) y pared trasera
    - {box: {min: [-0.096, -0.109, 0.342], max: [0.005, -0.101, 1.311]}, material: profile}
    - {box: {min: [-0.096, 0.101, 0.342], max: [0.005, 0.109, 1.311]}, material: profile}
    - {box: {min: [-0.096, -0.101, 0.342], max: [-0.088, 0.101, 1.311]}, material: profile}
    # alma interior del perfil (línea densa en x ≈ -0.04 del corte)
    - {box: {min: [-0.045, -0.101, 0.342], max: [-0.037, 0.101, 1.311]}, material: profile}
    # guías lineales frontales (resaltes en y ≈ ±0.09, x 0.0-0.02 del corte)
    - {box: {min: [0.005, -0.097, 0.342], max: [0.021, -0.077, 1.311]}, material: rail}
    - {box: {min: [0.005, 0.077, 0.342], max: [0.021, 0.097, 1.311]}, material: rail}
    # husillo (representativo: el firmware describe tornillo + guía lineal; diámetro no medido)
    - {cyl: {center: [-0.012, 0.0, 0.8265], radius: 0.008, length: 0.969, rpy: [0, 0, 0]}, material: screw}
    # placa superior (z 1.3211 en v2)
    - {box: {min: [-0.096, -0.110, 1.311], max: [0.030, 0.110, 1.3211]}, material: plate}

carriage:           # torso_lift_link (world, elevador en cero). Carro que une la bandeja con las guías
  frame: world
  parts:
    - {box: {min: [-0.035, -0.099, 0.930], max: [0.021, 0.099, 1.030]}, material: carriage}
    - {box: {min: [0.021, -0.075, 0.940], max: [0.030, 0.075, 0.990]}, material: carriage}

upper_box:          # mounting_cube_link (world). Bandeja + carcasa + monitor inclinado
  frame: world
  parts:
    # bandeja (z 0.962-0.99, x -0.046 a 0.287 en el escaneo)
    - {box: {min: [-0.046, -0.180, 0.966], max: [0.287, 0.181, 0.980]}, material: tray}
    # carcasa: pared trasera, techo y laterales
    - {box: {min: [0.021, -0.178, 0.980], max: [0.033, 0.178, 1.190]}, material: housing}
    - {box: {min: [0.021, -0.178, 1.180], max: [0.125, 0.178, 1.190]}, material: housing}
    - {box: {min: [0.021, -0.180, 0.980], max: [0.150, -0.172, 1.190]}, material: housing}
    - {box: {min: [0.021, 0.173, 0.980], max: [0.150, 0.181, 1.190]}, material: housing}
    # monitor: cara frontal ajustada x = 0.2020 - 0.228 (z - 1.0) → inclinación 12.8° hacia atrás; 0.362 x 0.216 m
    - {box_c: {center: [0.1718, 0.0004, 1.0878], size: [0.020, 0.362, 0.216], rpy: [0, -0.2241, 0]}, material: bezel}
    # bloque superior (x 0.030-0.044, y ±0.026, z hasta 1.253)
    - {box: {min: [0.030, -0.027, 1.190], max: [0.044, 0.025, 1.253]}, material: housing}
    # placa de montaje del Piper en el lateral izquierdo (base del brazo en y = 0.1818)
    - {box: {min: [-0.012, 0.181, 1.040], max: [0.090, 0.1818, 1.135]}, material: plate}

screen:             # screen_link (local: centro de la cara frontal del monitor, x = normal)
  frame: local
  parts:
    - {box_c: {center: [0.0006, 0, 0], size: [0.0012, 0.345, 0.198]}, material: screen}

pan_tilt_base:      # pan_tilt_base_link (local)
  frame: local
  parts:
    - {box_c: {center: [0, 0, 0.003], size: [0.070, 0.060, 0.006]}, material: plate}

pan:                # pan_link (local). Servo XL430 (28.5 x 34 x 46.5 mm); alto limitado al eje de tilt medido (38 mm)
  frame: local
  parts:
    - {box_c: {center: [0, 0, 0.0185], size: [0.034, 0.0285, 0.033]}, material: servo}
    - {cyl: {center: [0, 0, 0.0355], radius: 0.011, length: 0.005, rpy: [0, 0, 0]}, material: plate}

tilt:               # tilt_link (local, eje de tilt). Soporte en U y servo de tilt
  frame: local
  parts:
    - {box_c: {center: [0, 0.023, 0], size: [0.034, 0.0285, 0.040]}, material: servo}
    - {cyl: {center: [0, 0, 0], radius: 0.011, length: 0.050, rpy: [1.5708, 0, 0]}, material: plate}
    - {box_c: {center: [0.0175, 0, -0.0005], size: [0.040, 0.050, 0.004]}, material: plate}
    # micrófono RØDE VideoMic GO II (Ø21 mm) sobre la cámara: posición del escaneo (x 0.03-0.156, z ≈ 1.436)
    # expresada en tilt_link con el tilt del escaneo. Supuesto: va montado sobre el soporte de la cámara.
    - {cyl: {center: [0.0820, 0.0109, 0.0852], radius: 0.0105, length: 0.126, rpy: [0, 1.4739, 0]}, material: mic}
    - {box_c: {center: [0.045, 0.005, 0.051], size: [0.012, 0.012, 0.047]}, material: plate}

d435:               # camera_link (local: origen de profundidad). Carcasa 90 x 25 x 25 mm (Intel), extremos redondeados
  frame: local
  parts:
    - {box_c: {center: [0, -0.0175, 0], size: [0.025, 0.065, 0.025]}, material: realsense}
    - {cyl: {center: [0, -0.050, 0], radius: 0.0125, length: 0.025, rpy: [0, 1.5708, 0]}, material: realsense}
    - {cyl: {center: [0, 0.015, 0], radius: 0.0125, length: 0.025, rpy: [0, 1.5708, 0]}, material: realsense}
    # frente negro y lentes en las posiciones de los extrínsecos nominales (IR izq. 0, color +15 mm, IR der. -50 mm)
    - {box_c: {center: [0.0128, -0.0175, 0], size: [0.0008, 0.082, 0.017]}, material: realsense_front}
    - {cyl: {center: [0.0133, 0.0, 0], radius: 0.0045, length: 0.001, rpy: [0, 1.5708, 0]}, material: lens}
    - {cyl: {center: [0.0133, 0.015, 0], radius: 0.0040, length: 0.001, rpy: [0, 1.5708, 0]}, material: lens}
    - {cyl: {center: [0.0133, -0.050, 0], radius: 0.0045, length: 0.001, rpy: [0, 1.5708, 0]}, material: lens}
