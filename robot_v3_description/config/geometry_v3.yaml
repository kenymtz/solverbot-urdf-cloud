# =====================================================================================
#  GEOMETRÍA DE robot_v3 (metros, radianes). Marco REP-103: X adelante, Y izquierda, Z arriba.
#  Cada bloque indica su procedencia. Nada de este archivo es una estimación libre:
#    [v2]        medido en el escaneo métrico de robot_v2_description (config/robot_geometry.yaml, escala 1.4322)
#    [base_athome] valor del repositorio del equipo (ShiiSuii/base_athome @ 6edb8a4)
#    [ajuste]    ajuste por mínimos cuadrados documentado en tools/fit_arm_mount.py
#    [derivado]  combinación aritmética de los anteriores (fórmula indicada)
#    [fabricante] hoja de datos / descripción oficial del fabricante
#  Los valores PROVISIONALES de simulación están en config/sim_provisional.yaml, no aquí.
#  Convención de cero: lift (torso_lift_joint) = 0 es la altura del elevador durante el escaneo.
# =====================================================================================

base:
  # [v2] base_footprint = base_link en el piso, bajo el centro del marco superior del chasis
  #      (misma convención que hoverboard_base/robot.urdf.xacro)
  chassis_box:                       # [v2] colisión = percentiles 1-99 % de la malla escaneada
    center: [-0.0216, 0.0044, 0.2612]
    size: [0.4809, 0.4785, 0.3023]
  wheels:
    left:  [0.0815, 0.2835, 0.0837]  # [v2] círculo LSQ al neumático
    right: [0.0865, -0.2786, 0.0820] # [v2]
    visual_radius: 0.0840            # [v2] radio geométrico
    collision_radius: 0.0829         # [v2] altura medida del eje (contacto con el piso)
    width: 0.055                     # [base_athome] wheel_width (coincide con el escaneo)
    track_calibrated: 0.5620         # [base_athome] trocha calibrada (odometría); solo referencia
    radius_calibrated: 0.0853        # [base_athome] radio efectivo bajo carga (odometría)
  casters:                           # [v2] dos ruedas locas traseras (el repo modela una sola)
    rear_left:  [-0.1475, 0.2228, 0.0398]
    rear_right: [-0.1780, -0.2459, 0.0406]
    radius: 0.0402

laser:
  # [v2] base del cuerpo del Hokuyo (centrada en XY, apoyada en la placa); laser = punto focal a +0.0474 (urg_node/hokuyo_ust10.urdf.xacro)
  mount: [0.2429, 0.0082, 0.3165]
  focal_height: 0.0474
  body_size: [0.050, 0.050, 0.070]   # [fabricante] UST-05LX 50 x 50 x 70 mm

torso:
  column:
    origin: [-0.0350, -0.0026, 0.3300]       # [v2] column_link: eje del perfil, arranque sobre el chasis
    box_center: [0.0, 0.0008, 0.5044]        # [v2] colisión en el marco de la columna
    box_size: [0.1216, 0.2250, 0.9610]
    top_plate_z: 0.9911                      # [derivado] 1.3211 (placa superior, v2) - 0.33
  lift:
    # torso_lift_link sobre el eje de la columna, a la altura del borde inferior de la caja (0.9787, v2)
    origin_in_column: [0.0, 0.0, 0.6487]     # [derivado] 0.9787 - 0.3300
    axis: [0, 0, 1]
  box:
    # mounting_cube_link: caja superior (bandeja + monitor + carro), centro y tamaño medidos [v2]
    center_in_lift: [0.1695, 0.0030, 0.1116] # [derivado] (0.1345, 0.0004, 1.0903) - torso_lift_link
    size: [0.2964, 0.3573, 0.2283]           # [v2]
  screen:
    # [v2] pantalla 0.345 x 0.198 m, borde inferior a 0.980 m; en la cara frontal de la caja
    center_in_box: [0.1482, 0.0, -0.0113]    # [derivado] x = cara frontal (0.2827), z = 0.980 + 0.198/2
    size: [0.010, 0.345, 0.198]

arm_mount:
  # arm_base_link (base del Piper) en el costado izquierdo de la caja; z del brazo hacia +Y (afuera).
  # [ajuste] posición: cinemática OFICIAL del Piper en la pose DEFAULT_HOME de la Jetson
  #          (piper_arm_controller.py) ajustada a la malla escaneada del brazo: chamfer medio 12.6 mm.
  #          Incertidumbre: ±2 cm en X (ajuste libre de articulaciones: x = 0.060).
  # [base_athome] orientación rpy = (-pi/2, 0, 0) (cube_to_arm_joint); el ajuste de 6 GDL la confirma (<5°).
  position_world: [0.0392, 0.1818, 1.0877]
  origin_in_box: [-0.0953, 0.1814, -0.0026]  # [derivado] position_world - centro de la caja
  rpy: [-1.5707963267948966, 0.0, 0.0]
  tcp_offset: 0.1358                         # [fabricante] piper_ros: dedos a +0.1358 m de link6
  wrist_camera:
    # [base_athome] Orbbec DaBai DC1 en la pinza: gripper_base + (0.025, 0, 0.08); caja 30 x 90 x 25 mm
    origin_in_gripper: [0.025, 0.0, 0.080]
    size: [0.030, 0.090, 0.025]

head:
  # Cabezal pan-tilt (2 x Dynamixel XL430) con RealSense D435.
  # [v2] el soporte está sobre la placa superior del perfil (no sobre la caja): por defecto head_mount:=column.
  # [derivado] eje de tilt = centro de la carcasa de la cámara medido (v2: 0.0394, -0.0029, 1.3707; pitch 0.0969)
  #            menos el brazo de palanca de base_athome (0.035, 0, 0.015) rotado por el pitch medido.
  #            Se asume, como en base_athome, que los ejes de pan y tilt son coaxiales en XY.
  pan_tilt_base_in_column: [0.0381, -0.0003, 0.9911]   # (0.0031, -0.0029, 1.3211) en base_link
  pan_tilt_base_in_lift: [0.0381, -0.0003, 0.3424]     # misma posición, colgado de torso_lift_link
  tilt_axis_above_pan: 0.0381                          # [derivado] 1.3592 - 1.3211
  camera_lever_arm: [0.035, 0.0, 0.015]                # [base_athome] tilt -> centro de la carcasa (CAMERA_LEVER_ARM_M)
  tilt_at_scan: 0.0969                                 # [v2] pitch de la cámara en el escaneo (no es un cero calibrado)

realsense_d435:
  # [fabricante] realsense2_description/urdf/_d435.urdf.xacro (Apache-2.0, ros2-master @ 7a87097).
  # Extrínsecos NOMINALES. El driver real publica los calibrados de fábrica (publish_tf).
  cam_width: 0.090
  cam_height: 0.025
  cam_depth: 0.02505
  mount_from_center_offset: 0.0149
  glass_to_front: 0.0001
  zero_depth_to_glass: 0.0042
  depth_py: 0.0175
  depth_to_infra1: 0.0
  depth_to_infra2: -0.050
  depth_to_color: 0.015
